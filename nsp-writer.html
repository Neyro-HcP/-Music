<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050308"><meta name="description" content="Редактор текстов НсП."><title>Тексты НсП</title><link rel="icon" href="./public/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./public/app.css?v=followers-grid-20261027"><link rel="stylesheet" href="./public/site-nav.css?v=nav-redesign-20261106"><link rel="stylesheet" href="./public/nsp-writer.css?v=nsp-writer-20261028-1"><script src="./public/nsp-writer.js?v=copy-clean-20261105" defer></script>  <link rel="stylesheet" href="./public/brand-theme.css?v=nsp-brand-20261028">

01"/></svg></span><span class="nav-label">Игры</span></a></nav><div class="topbar-actions"><a class="top-export phone-nav-link" href="./tools.html">Все инструменты ↗</a></div></header>
<main class="writer-page"><div class="writer-heading"><div><div class="writer-kicker">ЛИРИКА / WORKSPACE</div><h1>Тексты НсП</h1></div><div class="writer-status"><i></i><span id="writerStatus">Не подключено</span></div></div>
<div class="writer-layout"><section class="writer-panel" aria-label="Параметры текста"><div class="writer-panel-title"><span>01 / НАСТРОЙКИ</span><span class="writer-live-mark">NSP</span></div>
<label class="writer-field"><span>Тема или ситуация</span><textarea id="writerTopic" rows="3" maxlength="1200" placeholder="Тема текста"></textarea></label>
<div class="writer-two-fields"><label class="writer-field"><span>Формат</span><select id="writerFormat"><option>Куплет на 16 строк</option><option>Припев на 8 строк</option><option>Куплет и припев</option><option>Короткий фристайл на 8 строк</option><option>Полный трек: два куплета и припев</option></select></label><label class="writer-field"><span>Настроение</span><select id="writerMood"><option>Абсурдное и ироничное</option><option>Меланхоличное</option><option>Уверенное и дерзкое</option><option>Спокойное, мелодичное</option><option>Мрачное и напряжённое</option><option>Смешанное</option></select></label></div>
<label class="writer-field"><span>Плотность рифм <output id="writerRhymeOutput">75%</output></span><input id="writerRhyme" type="range" min="20" max="100" step="5" value="75"></label><label class="writer-field"><span>Внутренние рифмы <output id="writerInternalOutput">80%</output></span><input id="writerInternal" type="range" min="0" max="100" step="5" value="80"></label>
<label class="writer-field"><span>Подача</span><select id="writerFlow"><option>Плавающий флоу, разговорная подача</option><option>Быстрый фристайл</option><option>Мелодичная и спокойная</option><option>Рубленые короткие строки</option><option>Плотный многоэтажный флоу</option></select></label>
<label class="writer-field"><span>Обязательные слова или детали </span><input id="writerWords" maxlength="500" placeholder="Слова и детали"></label>
<label class="writer-field"><span>Свои строки</span><textarea id="writerExamples" rows="7" maxlength="8000" placeholder="Свои строки"></textarea></label>
<button class="writer-generate" id="writerGenerate" type="button"><span>Создать текст</span><b>↗</b></button><p class="writer-error" id="writerError" role="status" aria-live="polite" hidden></p></section>
<section class="writer-panel writer-output-panel" aria-label="Результат"><div class="writer-panel-title"><span>02 / РЕЗУЛЬТАТ</span><div class="writer-output-actions"><button type="button" id="writerCopy" disabled>Копировать</button><button type="button" id="writerDownload" disabled>TXT ↓</button></div></div><div class="writer-output-meta"><span id="writerResultType">ОЖИДАЕТСЯ ТЕКСТ</span><span id="writerCharCount">0 знаков</span></div><textarea id="writerResult" class="writer-result" spellcheck="false" placeholder="" aria-label="Текст"></textarea><div class="writer-bottom-row"><span id="writerResultHint"></span><button type="button" id="writerClear">Очистить</button></div><details class="writer-api-settings"><summary>API</summary><div class="writer-api-body"><label class="writer-field"><span>Адрес backend API</span><input id="writerApiBase" type="url" placeholder="https://server.example"></label><button type="button" id="writerSaveApi">Сохранить адрес на устройстве</button><button type="button" id="writerTestApi">Проверить подключение</button></div></details></section></div></main></body></html>
