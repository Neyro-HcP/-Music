services:
  - type: web
    name: nsp-music
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: nsp-music-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
