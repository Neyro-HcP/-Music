    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script>
    window.addEventListener('error', function(event) {
      if (/module|webgl|three|cannon|failed to fetch/i.test(String(event.message || ''))) {
        var status = document.getElementById('phoneEngineStatus');
        var mode = document.getElementById('phoneRenderMode');
        if (status) status.textContent = '3D-движок не загружен.';
        if (mode) mode.textContent = 'НЕ УДАЛОСЬ ЗАПУСТИТЬ';
      }
    });
  </script>
  <script type="module" src="./public/rgb-phone-3d.js?v=rgb-phone-3d-20261028-physics8-inertial-bubbles"></script>
  <link rel="stylesheet" href="./public/brand-theme.css?v=nsp-brand-20261028">
</head>
<body>
  <div class="site-noise" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Главная"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span></a>

      <a class="site-tab" href="./phone.html" aria-current="page"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.4"/><path d="M10 5h4"/><path d="M10.5 18.5h3"/></svg></span><span class="nav-label">RGB Phone</span></a><a class="site-tab" href="./encyclopedia.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20"/><path d="M8 7h8"/><path d="M8 10h6"/></svg></span><span class="nav-label">Энциклопедия</span></a><a class="site-tab" href="./chronology.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span class="nav-label">Хронология</span></a>

      <a class="site-tab" href="./games.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 9h10a4 4 0 0 1 3.8 5l-1 3a2 2 0 0 1-3.2 1L14 16h-4l-2.6 2a2 2 0 0 1-3.2-1l-1-3A4 4 0 0 1 7 9z"/><path d="M8 11v4"/><path d="M6 13h4"/><path d="M16 12h.01"/><path d="M18 14h.01"/></svg></span><span class="nav-label">Игры</span></a>

    <div class="topbar-actions">
      <a class="top-export phone-nav-link" href="./">К визуализатору ↗</a>
    </div>
  </header>
  <main class="phone-page">
    <div class="phone-page-intro">
      <div>
        <div class="phone-kicker">INTERACTIVE PHYSICS</div>
        <h1>RGB PHONE</h1>
        
      </div>
      <div class="phone-intro-meta"><i></i><span id="phoneRenderMode">3D ENGINE · ЗАПУСК</span></div>
    </div>
    <section class="phone-workspace" aria-label="3D физическая песочница">
      <div class="phone-device-panel">
        <div class="phone-device-stage">
          <div class="phone-device" aria-label="Телефон с RGB-подсветкой">
            <div class="phone-bezel">
              <div class="phone-notch" aria-hidden="true"><span></span></div>
              <div class="phone-screen" id="phoneScreen">
                <canvas id="phoneCanvas" tabindex="0" aria-label="3D-сцена. Перетаскивай предметы, бросай их и нажимай на TNT."></canvas>
              </div>
              <div class="phone-home" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
      <aside class="phone-side-panel">
        <h2 class="phone-side-title">Добавить предметы</h2>
        
        <div class="phone-action-grid">
          <button class="phone-action" type="button" data-phone-add="rubber"><span class="phone-action-icon">●</span> Шарики</button>
          <button class="phone-action" type="button" data-phone-add="ice"><span class="phone-action-icon">◇</span> Лёд</button>
          <button class="phone-action" type="button" data-phone-add="cube"><span class="phone-action-icon">◈</span> Кубики</button>
          <button class="phone-action" type="button" data-phone-add="tnt"><span class="phone-action-icon">▦</span> TNT</button>
        </div>
        <div class="phone-divider"></div>
        <h2 class="phone-side-title">Раскраска</h2>
        <label class="phone-color-picker" for="phonePaintColor">
          <span>Цвет предметов</span>
          <input id="phonePaintColor" type="color" value="#a78bfa" aria-label="Выбрать цвет раскраски">
        </label>
        <button class="phone-action phone-action-wide" id="phonePaintMode" type="button" aria-pressed="false">✦ Кисть: выкл.</button>
        
        <div class="phone-divider"></div>
        <h2 class="phone-side-title">Жидкости</h2>
        <div class="phone-action-grid">
          <button class="phone-action" id="phoneWater" type="button" data-liquid="water" aria-pressed="false"><span class="phone-action-icon">💧</span> Налить воду</button>
          <button class="phone-action" id="phoneSlime" type="button" data-liquid="slime" aria-pressed="false"><span class="phone-action-icon">●</span> Налить слизь</button>
        </div>
        
        <div class="phone-divider"></div>
        <h2 class="phone-side-title">Управление</h2>
        <div class="phone-action-grid">
          <button class="phone-action" id="phoneSound" type="button" aria-pressed="true"><span class="phone-action-icon">♫</span><span id="phoneSoundLabel">Звук</span></button>
          <button class="phone-action" id="phoneTilt" type="button" aria-pressed="false"><span class="phone-action-icon">↻</span><span id="phoneTiltLabel">Наклон</span></button>
          <button class="phone-action phone-action-wide" id="phoneClear" type="button">Очистить экран</button>
          <button class="phone-action phone-action-primary phone-action-wide" id="phoneReset" type="button">Восстановить сцену</button>
        </div>
        
        <div class="phone-engine-status"><i></i><span id="phoneEngineStatus">Подготовка 3D-сцены…</span></div>
      </aside>
    </section>
    
  </main>
</body>
</html>
